services:
  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: haushaltsbuch-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - haushaltsbuch_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - haushaltsbuch-net

  # ── Backend ───────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/fr33z3m4n/haushaltsbuch-backend:latest
    container_name: haushaltsbuch-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - haushaltsbuch-net

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    image: ghcr.io/fr33z3m4n/haushaltsbuch-frontend:latest
    container_name: haushaltsbuch-frontend
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-/api}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - haushaltsbuch-net

networks:
  haushaltsbuch-net:
    driver: bridge

volumes:
  haushaltsbuch_mysql_data:
    driver: local
